<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>PDF Scan</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #2196F3;
      --accent-dark: #1565C0;
      --danger: #e53935;
      --success: #43a047;
      --bg: #121212;
      --surface: #1e1e1e;
      --surface2: #2c2c2c;
      --text: #f0f0f0;
      --text-muted: #999;
      --radius: 14px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* ── screens ── */
    .screen { display: none; flex-direction: column; height: 100dvh; }
    .screen.active { display: flex; }

    /* ── header ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
      background: var(--surface);
      flex-shrink: 0;
    }
    .topbar h1 { font-size: 1.1rem; font-weight: 600; }
    .topbar .icon-btn {
      background: none; border: none; color: var(--text-muted);
      font-size: 1.4rem; cursor: pointer; padding: 4px;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── viewfinder ── */
    #viewfinder-wrap {
      position: relative;
      flex: 1;
      overflow: hidden;
      background: #000;
    }
    #video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .corner-guide {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(80vw, 320px);
      aspect-ratio: 0.707;
      pointer-events: none;
    }
    .corner-guide::before, .corner-guide::after,
    .corner-guide span::before, .corner-guide span::after {
      content: '';
      position: absolute;
      width: 24px; height: 24px;
      border-color: rgba(255,255,255,0.7);
      border-style: solid;
    }
    .corner-guide::before  { top:0; left:0;   border-width: 3px 0 0 3px; }
    .corner-guide::after   { top:0; right:0;  border-width: 3px 3px 0 0; }
    .corner-guide span::before { bottom:0; left:0;  border-width: 0 0 3px 3px; }
    .corner-guide span::after  { bottom:0; right:0; border-width: 0 3px 3px 0; }

    .hint-text {
      position: absolute; bottom: 16px; left: 0; right: 0;
      text-align: center;
      color: rgba(255,255,255,0.7);
      font-size: 0.85rem;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      pointer-events: none;
    }

    /* ── capture bar ── */
    .capture-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 24px;
      background: var(--surface);
      gap: 32px;
      flex-shrink: 0;
    }
    .shutter {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: #fff;
      border: 5px solid rgba(255,255,255,0.3);
      cursor: pointer;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s, background 0.1s;
    }
    .shutter:active { transform: scale(0.93); background: #ddd; }
    .side-btn {
      background: var(--surface2); border: none; border-radius: 50%;
      color: var(--text); width: 48px; height: 48px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── adjust (corner-edit) screen ── */
    #adjust-wrap {
      position: relative;
      flex: 1;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #adjust-canvas-holder {
      position: relative;
      line-height: 0;
    }
    #adjust-canvas { display: block; }
    #adjust-overlay {
      position: absolute;
      top: 0; left: 0;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── result screen ── */
    #result-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    #result-canvas {
      width: 100%;
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      display: block;
    }
    .result-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0 0 24px;
      flex-shrink: 0;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none; border-radius: var(--radius);
      font-size: 1rem; font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.8; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--surface2); color: var(--text); }
    .btn-danger { background: var(--danger); color: #fff; }

    /* ── upload status overlay ── */
    #upload-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    #upload-overlay.active { display: flex; }
    .spinner {
      width: 52px; height: 52px;
      border: 5px solid rgba(255,255,255,0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #upload-overlay p { font-size: 1rem; color: var(--text-muted); }
    .status-icon { font-size: 3rem; }

    /* ── loading opencv ── */
    #loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      height: 100dvh;
      background: var(--bg);
    }
    #loading-screen p { color: var(--text-muted); font-size: 0.9rem; }
    #loading-progress { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>

<!-- Loading screen while OpenCV initialises -->
<div id="loading-screen">
  <div class="spinner"></div>
  <p>Lade Scan-Engine…</p>
  <p id="loading-progress"></p>
</div>

<!-- ══ CAMERA SCREEN ══════════════════════════════════════════════════════════ -->
<div class="screen" id="screen-camera">
  <div class="topbar">
    <span></span>
    <h1>📄 Dokument scannen</h1>
    <button class="icon-btn" id="btn-flip-camera" title="Kamera wechseln">⇄</button>
  </div>

  <div id="viewfinder-wrap">
    <video id="video" playsinline autoplay muted></video>
    <div class="corner-guide"><span></span></div>
    <p class="hint-text">Dokument im Rahmen positionieren</p>
  </div>

  <div class="capture-bar">
    <div style="width:48px;"></div>
    <button class="shutter" id="btn-capture" title="Foto aufnehmen"></button>
    <div style="width:48px;"></div>
  </div>
</div>

<!-- ══ ADJUST SCREEN (Ecken anpassen) ═══════════════════════════════════════════ -->
<div class="screen" id="screen-adjust">
  <div class="topbar">
    <button class="icon-btn" id="btn-adjust-back" title="Zurück zur Kamera">←</button>
    <h1>Ecken anpassen</h1>
    <span style="width:32px;"></span>
  </div>

  <div id="adjust-wrap">
    <div id="adjust-canvas-holder">
      <canvas id="adjust-canvas"></canvas>
      <canvas id="adjust-overlay"></canvas>
    </div>
    <p class="hint-text">Ecken an die Dokumentkanten ziehen</p>
  </div>

  <div class="capture-bar">
    <button class="btn btn-primary" id="btn-adjust-confirm" style="width:auto; padding: 14px 40px;">
      ✓ Übernehmen
    </button>
  </div>
</div>

<!-- ══ RESULT SCREEN ══════════════════════════════════════════════════════════ -->
<div class="screen" id="screen-result">
  <div class="topbar">
    <button class="icon-btn" id="btn-back" title="Zurück">←</button>
    <h1>Ergebnis</h1>
    <span style="width:32px;"></span>
  </div>

  <div id="result-wrap">
    <canvas id="result-canvas"></canvas>
  </div>

  <div class="result-bar" style="padding: 0 16px 24px;">
    <button class="btn btn-primary" id="btn-upload">
      ☁ Als PDF hochladen
    </button>
    <button class="btn btn-secondary" id="btn-rescan">
      ↺ Erneut scannen
    </button>
  </div>
</div>

<!-- Upload overlay -->
<div id="upload-overlay">
  <div id="overlay-spinner" class="spinner"></div>
  <div id="overlay-icon" class="status-icon" style="display:none;"></div>
  <p id="overlay-msg">Wird hochgeladen…</p>
</div>

<!-- ── Libraries ──────────────────────────────────────────────────────────── -->
<!-- OpenCV.js (known-good build, also used previously) -->
<script async src="https://cdn.jsdelivr.net/npm/jscanify@1.4.2/src/opencv.js"
  onload="onOpenCvReady()" onerror="cvLoadError()"></script>
<!-- jsPDF for PDF generation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script type="module">
  import { DocumentScanner } from 'https://cdn.jsdelivr.net/npm/opencv-document-scanner@1.2.2/dist/opencv-document-scanner.js';

  // ── state ────────────────────────────────────────────────────────────────
  let scanner = null;
  let stream = null;
  let facingMode = 'environment';
  let scannedCanvas = null;

  // Full-res still frame grabbed on shutter press, and the quad the user
  // adjusts on top of it (order: [topLeft, topRight, bottomRight, bottomLeft],
  // in captureCanvas pixel coordinates).
  let captureCanvas = null;
  let adjustQuad = null;
  let adjustScale = 1;
  let draggingIndex = null;

  function dist(p1, p2) { return Math.hypot(p1.x - p2.x, p1.y - p2.y); }

  // DocumentScanner's stock getCornerPoints() assigns corners by quadrant
  // relative to the shape's centroid (same technique as jscanify, which this
  // page used previously). That breaks down as soon as the document is
  // rotated in frame (common on handheld photos) and produces a bad initial
  // guess. Replace it with the standard rotation-tolerant "sum/diff" corner
  // ordering: top-left = min(x+y), bottom-right = max(x+y),
  // top-right = min(y-x), bottom-left = max(y-x).
  // Return order matches the original: [topLeft, topRight, bottomRight, bottomLeft].
  // This only seeds the corner-adjust screen now (see below) — the user drags
  // the handles to the true edges before anything gets cropped, so a decent
  // starting guess is all this needs to provide.
  DocumentScanner.prototype.getCornerPoints = function (contour) {
    let minSum = Infinity, maxSum = -Infinity, minDiff = Infinity, maxDiff = -Infinity;
    let topLeft, topRight, bottomLeft, bottomRight;

    for (let i = 0; i + 1 < contour.data32S.length; i += 2) {
      const x = contour.data32S[i];
      const y = contour.data32S[i + 1];
      const sum  = x + y;
      const diff = y - x;
      if (sum  < minSum)  { minSum  = sum;  topLeft     = { x, y }; }
      if (sum  > maxSum)  { maxSum  = sum;  bottomRight = { x, y }; }
      if (diff < minDiff) { minDiff = diff; topRight    = { x, y }; }
      if (diff > maxDiff) { maxDiff = diff; bottomLeft  = { x, y }; }
    }

    return [topLeft, topRight, bottomRight, bottomLeft];
  };

  const video         = document.getElementById('video');
  const resultCanvas  = document.getElementById('result-canvas');
  const loadingScreen = document.getElementById('loading-screen');
  const loadingProgress = document.getElementById('loading-progress');

  const adjustWrap       = document.getElementById('adjust-wrap');
  const adjustHolder      = document.getElementById('adjust-canvas-holder');
  const adjustCanvas      = document.getElementById('adjust-canvas');
  const adjustCtx         = adjustCanvas.getContext('2d');
  const adjustOverlay     = document.getElementById('adjust-overlay');
  const adjustOverlayCtx  = adjustOverlay.getContext('2d');

  // ── OpenCV ready ──────────────────────────────────────────────────────────
  // Exposed on window: referenced from the onload/onerror HTML attributes on
  // the opencv.js <script> tag, which run in global scope, not module scope.
  window.onOpenCvReady = function onOpenCvReady() {
    // cv may still be loading – wait for it
    if (typeof cv === 'undefined' || cv.getBuildInformation === undefined) {
      setTimeout(onOpenCvReady, 200);
      return;
    }
    scanner = new DocumentScanner();
    loadingScreen.style.display = 'none';
    showScreen('screen-camera');
    startCamera();
  };

  window.cvLoadError = function cvLoadError() {
    loadingProgress.textContent = 'Fehler beim Laden der Scan-Engine.';
  };

  // ── camera ────────────────────────────────────────────────────────────────
  async function startCamera() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showCameraError(
        'Kein Kamerazugriff möglich.',
        window.location.protocol === 'http:'
          ? 'Browser erlauben Kamerazugriff nur über HTTPS. Bitte richte HTTPS ein (z.B. nginx Reverse-Proxy) und öffne die Seite über https://…'
          : 'Dein Browser unterstützt die Kamera-API nicht oder der Zugriff wurde verweigert.'
      );
      return;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
      video.srcObject = stream;
      video.play();
    } catch (e) {
      let hint = '';
      if (e.name === 'NotAllowedError') hint = 'Kameraberechtigung wurde verweigert. Bitte in den Browser-Einstellungen erlauben.';
      else if (e.name === 'NotFoundError') hint = 'Keine Kamera gefunden.';
      else if (window.location.protocol === 'http:') hint = 'Kamerazugriff erfordert HTTPS. Seite über https://… öffnen.';
      showCameraError('Kamera konnte nicht gestartet werden.', hint || e.message);
    }
  }

  function showCameraError(title, detail) {
    var wrap = document.getElementById('viewfinder-wrap');
    wrap.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:24px;text-align:center;gap:16px;">'
      + '<div style="font-size:3rem;">📷</div>'
      + '<strong style="color:#fff;">' + title + '</strong>'
      + (detail ? '<p style="color:rgba(255,255,255,0.6);font-size:0.85rem;max-width:320px;">' + detail + '</p>' : '')
      + '</div>';
  }

  document.getElementById('btn-flip-camera').addEventListener('click', () => {
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    startCamera();
  });

  // ── capture ───────────────────────────────────────────────────────────────
  // Capture is manual-only, like a normal camera shutter: no live "is this a
  // document" detection loop. Automatic per-frame edge detection turned out
  // unreliable in practice (varies with lighting/background/rotation), so
  // detection now runs once on the captured still as a starting guess, and
  // the user confirms or drags the corners to the real edges on the next
  // screen before anything gets warped.
  document.getElementById('btn-capture').addEventListener('click', () => {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return;

    captureCanvas = document.createElement('canvas');
    captureCanvas.width = vw;
    captureCanvas.height = vh;
    captureCanvas.getContext('2d').drawImage(video, 0, 0, vw, vh);

    let pts = null;
    try {
      const detected = scanner.detect(captureCanvas);
      if (detected && detected.length === 4 && detected.every(p => p)) {
        pts = detected;
      }
    } catch (_) {
      // Fall through to the default inset quad below.
    }

    if (!pts) {
      // No reliable detection – default to a quad inset from the frame edges
      // so there's always something sensible to start dragging from.
      const mx = vw * 0.08, my = vh * 0.08;
      pts = [
        { x: mx, y: my }, { x: vw - mx, y: my },
        { x: vw - mx, y: vh - my }, { x: mx, y: vh - my }
      ];
    }

    adjustQuad = pts;
    openAdjustScreen();
  });

  // ── adjust screen: corner drag editor ────────────────────────────────────
  function openAdjustScreen() {
    showScreen('screen-adjust');
    // Wait a frame so #adjust-wrap has its final layout size before we measure it.
    requestAnimationFrame(() => {
      const maxW = Math.max(50, adjustWrap.clientWidth - 32);
      const maxH = Math.max(50, adjustWrap.clientHeight - 32);
      adjustScale = Math.min(maxW / captureCanvas.width, maxH / captureCanvas.height, 1);

      const displayW = Math.max(1, Math.round(captureCanvas.width * adjustScale));
      const displayH = Math.max(1, Math.round(captureCanvas.height * adjustScale));

      [adjustCanvas, adjustOverlay].forEach(c => { c.width = displayW; c.height = displayH; });
      adjustHolder.style.width  = displayW + 'px';
      adjustHolder.style.height = displayH + 'px';

      adjustCtx.drawImage(captureCanvas, 0, 0, displayW, displayH);
      drawAdjustOverlay();
    });
  }

  function toDisplay(p) { return { x: p.x * adjustScale, y: p.y * adjustScale }; }
  function toFullRes(p)  { return { x: p.x / adjustScale, y: p.y / adjustScale }; }

  function drawAdjustOverlay() {
    const w = adjustOverlay.width, h = adjustOverlay.height;
    adjustOverlayCtx.clearRect(0, 0, w, h);
    const pts = adjustQuad.map(toDisplay);

    adjustOverlayCtx.beginPath();
    adjustOverlayCtx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) adjustOverlayCtx.lineTo(pts[i].x, pts[i].y);
    adjustOverlayCtx.closePath();
    adjustOverlayCtx.fillStyle = 'rgba(33, 150, 243, 0.15)';
    adjustOverlayCtx.fill();
    adjustOverlayCtx.strokeStyle = '#2196F3';
    adjustOverlayCtx.lineWidth = 2;
    adjustOverlayCtx.stroke();

    pts.forEach(p => {
      adjustOverlayCtx.beginPath();
      adjustOverlayCtx.arc(p.x, p.y, 14, 0, Math.PI * 2);
      adjustOverlayCtx.fillStyle = '#fff';
      adjustOverlayCtx.fill();
      adjustOverlayCtx.lineWidth = 3;
      adjustOverlayCtx.strokeStyle = '#2196F3';
      adjustOverlayCtx.stroke();
    });
  }

  const HANDLE_HIT_RADIUS = 28;

  function overlayPointFromEvent(e) {
    const rect = adjustOverlay.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  adjustOverlay.addEventListener('pointerdown', (e) => {
    const p = overlayPointFromEvent(e);
    const displayPts = adjustQuad.map(toDisplay);
    let best = -1, bestDist = HANDLE_HIT_RADIUS;
    displayPts.forEach((dp, i) => {
      const d = Math.hypot(dp.x - p.x, dp.y - p.y);
      if (d <= bestDist) { bestDist = d; best = i; }
    });
    if (best >= 0) {
      draggingIndex = best;
      adjustOverlay.setPointerCapture(e.pointerId);
    }
  });

  adjustOverlay.addEventListener('pointermove', (e) => {
    if (draggingIndex === null) return;
    const p = overlayPointFromEvent(e);
    const clamped = {
      x: Math.min(Math.max(p.x, 0), adjustOverlay.width),
      y: Math.min(Math.max(p.y, 0), adjustOverlay.height)
    };
    adjustQuad[draggingIndex] = toFullRes(clamped);
    drawAdjustOverlay();
  });

  function endDrag() { draggingIndex = null; }
  adjustOverlay.addEventListener('pointerup', endDrag);
  adjustOverlay.addEventListener('pointercancel', endDrag);

  document.getElementById('btn-adjust-back').addEventListener('click', () => {
    showScreen('screen-camera');
  });

  document.getElementById('btn-adjust-confirm').addEventListener('click', () => {
    scannedCanvas = null;
    try {
      const [topLeft, topRight, bottomRight, bottomLeft] = adjustQuad;

      const widthTop    = dist(topLeft, topRight);
      const widthBottom = dist(bottomLeft, bottomRight);
      const heightLeft  = dist(topLeft, bottomLeft);
      const heightRight = dist(topRight, bottomRight);

      let outW = Math.max(widthTop, widthBottom);
      let outH = Math.max(heightLeft, heightRight);

      // Upscale small captures for a crisp, OCR-friendly result (cap the long side).
      const maxDim = 2200;
      const scale = Math.min(maxDim / Math.max(outW, outH), 3);
      outW = Math.max(1, Math.round(outW * scale));
      outH = Math.max(1, Math.round(outH * scale));

      scannedCanvas = scanner.crop(captureCanvas, adjustQuad, outW, outH);
    } catch (e) {
      console.warn('crop failed, using raw capture:', e);
    }

    if (!scannedCanvas) {
      // Fallback: warp failed for some reason – use the uncropped photo.
      scannedCanvas = captureCanvas;
    }

    const ctx = resultCanvas.getContext('2d');
    resultCanvas.width  = scannedCanvas.width;
    resultCanvas.height = scannedCanvas.height;
    ctx.drawImage(scannedCanvas, 0, 0);

    showScreen('screen-result');
  });

  // ── result navigation ─────────────────────────────────────────────────────
  document.getElementById('btn-back').addEventListener('click', () => showScreen('screen-camera'));
  document.getElementById('btn-rescan').addEventListener('click', () => showScreen('screen-camera'));

  // ── PDF generation & upload ───────────────────────────────────────────────
  document.getElementById('btn-upload').addEventListener('click', async () => {
    showUploadOverlay('loading', 'PDF wird erstellt…');

    try {
      const pdfBlob = await canvasToPdfBlob(resultCanvas);
      showUploadOverlay('loading', 'Wird hochgeladen…');

      const filename = 'scan_' + new Date().toISOString().replace(/[:.]/g, '-') + '.pdf';
      const form = new FormData();
      form.append('file', pdfBlob, filename);

      const resp = await fetch('/upload_mobile', { method: 'POST', body: form });
      const data = await resp.json();

      if (data.success) {
        showUploadOverlay('success', '✅ Erfolgreich hochgeladen!');
        setTimeout(() => {
          hideUploadOverlay();
          showScreen('screen-camera');
        }, 2000);
      } else {
        showUploadOverlay('error', '❌ Fehler: ' + (data.error || 'Unbekannt'));
        setTimeout(hideUploadOverlay, 3000);
      }
    } catch (e) {
      showUploadOverlay('error', '❌ ' + e.message);
      setTimeout(hideUploadOverlay, 3000);
    }
  });

  function canvasToPdfBlob(canvas) {
    return new Promise((resolve) => {
      const { jsPDF } = window.jspdf;
      const imgData = canvas.toDataURL('image/jpeg', 0.92);

      // Fit canvas proportions into A4
      const mmW = 210, mmH = 297;
      const ratio = canvas.width / canvas.height;
      let pdfW = mmW, pdfH = mmW / ratio;
      if (pdfH > mmH) { pdfH = mmH; pdfW = mmH * ratio; }
      const offX = (mmW - pdfW) / 2;
      const offY = (mmH - pdfH) / 2;

      const doc = new jsPDF({ orientation: pdfH > pdfW ? 'p' : 'l', unit: 'mm', format: 'a4' });
      doc.addImage(imgData, 'JPEG', offX, offY, pdfW, pdfH);
      resolve(doc.output('blob'));
    });
  }

  // ── upload overlay helpers ────────────────────────────────────────────────
  function showUploadOverlay(type, msg) {
    const overlay  = document.getElementById('upload-overlay');
    const spinner  = document.getElementById('overlay-spinner');
    const icon     = document.getElementById('overlay-icon');
    const msgEl    = document.getElementById('overlay-msg');

    msgEl.textContent = msg;
    if (type === 'loading') {
      spinner.style.display = ''; icon.style.display = 'none';
    } else {
      spinner.style.display = 'none';
      icon.style.display = '';
      icon.textContent = type === 'success' ? '✅' : '❌';
    }
    overlay.classList.add('active');
  }

  function hideUploadOverlay() {
    document.getElementById('upload-overlay').classList.remove('active');
  }

  // ── screen switcher ───────────────────────────────────────────────────────
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
</script>
</body>
</html>
